<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DANN | INDUSTRIAL COCKPIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #09090b; color: #a1a1aa; font-family: 'Inter', sans-serif; }
        .log-line { border-left: 2px solid #27272a; padding-left: 10px; margin-bottom: 4px; font-size: 11px; }
        .log-ingest { border-left-color: #3b82f6; color: #bfdbfe; }
        .log-reason { border-left-color: #8b5cf6; color: #ddd6fe; }
        .log-plan { border-left-color: #10b981; color: #a7f3d0; }
        .log-execute { border-left-color: #f59e0b; color: #fde68a; }
        .log-learn { border-left-color: #ec4899; color: #fbcfe8; }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="h-12 border-b border-zinc-800 flex items-center px-4 justify-between bg-zinc-900">
        <div class="flex items-center gap-4">
            <span class="font-bold text-white text-sm">DANN <span class="text-zinc-500">INDUSTRIAL</span></span>
            <div class="h-6 w-px bg-zinc-700"></div>
            <button onclick="performAction('reset')" class="text-[10px] text-zinc-500 hover:text-white uppercase font-bold">RESET</button>
            <button onclick="performAction('retrain')" class="text-[10px] text-zinc-500 hover:text-white uppercase font-bold">RETRAIN</button>
        </div>
        <div id="runtime-status" class="px-2 py-0.5 rounded bg-zinc-800 text-[9px] text-zinc-400 font-bold uppercase tracking-widest">IDLE</div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Trace Stream -->
        <div class="w-1/3 border-r border-zinc-800 flex flex-col bg-zinc-950">
            <div class="p-3 border-b border-zinc-800 text-[10px] font-bold text-zinc-500 uppercase">Live Trace Stream</div>
            <div id="logContainer" class="flex-1 overflow-y-auto p-4 font-mono"></div>
        </div>

        <!-- Main Workspace -->
        <div class="w-2/3 flex flex-col p-6 overflow-y-auto">
            <form id="queryForm" class="mb-6">
                <textarea id="goalInput" class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded text-sm text-zinc-200 focus:border-zinc-500 outline-none" placeholder="Execute neural query..."></textarea>
                <button type="submit" class="mt-2 bg-white text-black px-6 py-2 rounded text-[10px] font-bold uppercase tracking-widest hover:bg-zinc-200">Submit Task</button>
            </form>
            <div id="resultOutput" class="space-y-6"></div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('logContainer');
        const resultOutput = document.getElementById('resultOutput');
        const statusEl = document.getElementById('runtime-status');

        function appendLog(phase, msg) {
            const line = document.createElement('div');
            line.className = `log-line log-${phase.toLowerCase()}`;
            line.innerHTML = `<span class="opacity-50">${new Date().toLocaleTimeString()}</span> [${phase.toUpperCase()}] ${msg}`;
            logContainer.prepend(line);
        }

        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const goal = document.getElementById('goalInput').value;
            statusEl.textContent = 'RUNNING'; statusEl.className = 'px-2 py-0.5 rounded bg-blue-900/50 text-blue-400 border border-blue-800 text-[9px] font-bold uppercase';
            
            appendLog('Ingest', 'Starting parse: ' + goal.slice(0, 20));
            const form = new FormData(); form.append('goal', goal);
            
            const res = await fetch('/api/v2/run', { method: 'POST', body: form });
            const html = await res.text();
            
            appendLog('Reason', 'Intent Resolved & Plan Validated');
            appendLog('Execute', 'Database Operation Commited');
            appendLog('Learn', 'Matrix evolution checked');
            
            resultOutput.innerHTML = html;
            statusEl.textContent = 'IDLE'; statusEl.className = 'px-2 py-0.5 rounded bg-zinc-800 text-[9px] text-zinc-400 font-bold uppercase';
        });

        async function performAction(type) {
            const res = await fetch(`/api/v2/action/${type}`, { method: 'POST', body: new FormData() });
            appendLog('Learn', `System action ${type} triggered.`);
        }
    </script>
</body>
</html>
