<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agentic Neural Evolution Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-light tracking-tight text-white">DANN <span class="text-blue-500 font-bold">Evolution Engine</span></h1>
            <div id="status-badge" class="px-3 py-1 bg-green-900/30 text-green-400 border border-green-800 rounded text-xs uppercase tracking-widest">System Online</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Left: Inputs -->
            <div class="lg:col-span-1 space-y-6">
                <form hx-post="/api/v2/run" hx-target="#evolution-trace" hx-indicator="#loading" class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                    <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase">Query Input</label>
                    <textarea name="goal" class="w-full h-24 bg-slate-950 border border-slate-700 p-3 rounded text-sm mb-4" placeholder="Request..."></textarea>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded text-sm font-bold text-white transition">Process Neural Query</button>
                </form>
            </div>

            <!-- Right: Layers & Trace -->
            <div class="lg:col-span-3 space-y-6" id="evolution-trace">
                <div class="text-center py-20 text-slate-600 italic">Waiting for Neural Input...</div>
            </div>
        </div>
    </div>
</body>
</html>
